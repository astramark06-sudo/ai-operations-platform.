name: Feature request
description: Suggest a user-facing feature or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem or unmet need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe alternative approaches, if any.
    validations:
      required: false
  - type: checkboxes
    id: cost
    attributes:
      label: Cost constraint
      options:
        - label: This can be implemented without requiring a paid service or subscription.
          required: true
