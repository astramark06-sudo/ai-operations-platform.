name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  detect:
    name: Detect supported source
    runs-on: ubuntu-latest
    outputs:
      has_source: ${{ steps.scan.outputs.has_source }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect JavaScript or TypeScript
        id: scan
        shell: bash
        run: |
          if git ls-files | grep -Eq '\.(js|jsx|ts|tsx|mjs|cjs)$'; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "No JavaScript/TypeScript source yet; CodeQL will start after the app is added."
          fi

  analyze:
    name: Analyze JavaScript and TypeScript
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
