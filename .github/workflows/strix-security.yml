name: Strix security scan

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: strix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: White-box security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRIX_LLM: ${{ secrets.STRIX_LLM }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Strix
        if: ${{ env.STRIX_LLM != '' && env.LLM_API_KEY != '' }}
        run: curl -fsSL https://strix.ai/install | bash

      - name: Scan repository
        if: ${{ env.STRIX_LLM != '' && env.LLM_API_KEY != '' }}
        run: strix -n --target ./ --scan-mode quick --max-budget 10 --fail-on high

      - name: Explain skipped scan
        if: ${{ env.STRIX_LLM == '' || env.LLM_API_KEY == '' }}
        run: |
          echo "::notice::Strix scan skipped. Add STRIX_LLM and LLM_API_KEY as repository Actions secrets to enable it."
