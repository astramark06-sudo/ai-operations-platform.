name: Accessibility audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTPS page URL to audit
        required: true
        type: string

permissions:
  contents: read

jobs:
  pa11y:
    name: Audit page accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate target URL
        env:
          TARGET_URL: ${{ inputs.url }}
        run: python scripts/validate_public_url.py "$TARGET_URL"
      - name: Run Pa11y CI
        env:
          TARGET_URL: ${{ inputs.url }}
        run: npx --yes pa11y-ci@5.0.0 "$TARGET_URL"
