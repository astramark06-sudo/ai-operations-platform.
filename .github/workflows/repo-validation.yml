name: Repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-\u0024{{ github.workflow }}-\u0024{{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Validate MCP and environment configuration
        run: python scripts/validate_repo.py
      - name: Validate toolkit installer syntax
        run: bash -n scripts/setup-agent-toolkit.sh
      - name: Check patch whitespace
        run: git diff --check
